<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking Dashboard</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:#f4f4f4;
}

/* Signup Form */

.container{
    width:400px;
    margin:40px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2,h3{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

/* Dashboard */

.dashboard{
    display:none;
    padding:20px;
}

.topbar{
    background:#007bff;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:45px;
    height:45px;
    border-radius:50%;
}

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.history{
    background:#eee;
    padding:10px;
    border-radius:5px;
    margin-top:10px;
    max-height:150px;
    overflow:auto;
}

ul{
    padding-left:20px;
}

@media(max-width:768px){
    .main{
        grid-template-columns:1fr;
    }

    .container{
        width:90%;
    }
}

</style>
</head>

<body>

<!-- Signup -->

<div class="container" id="signupBox">

    <h2>Create Account</h2>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <button onclick="createAccount()">Signup</button>

</div>

<!-- Dashboard -->

<div class="dashboard" id="dashboard">

    <div class="topbar">

        <h2>My Dashboard</h2>

        <div class="profile">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

            <div>
                <div id="profileName"></div>
                <small id="profileEmail"></small>
            </div>
        </div>

    </div>

    <div class="main">

        <!-- Deposit -->

        <div class="card">

            <h3>Deposit</h3>

            <input type="number" id="depositAmount" placeholder="Enter Deposit Amount">

            <button onclick="depositMoney()">Deposit</button>

            <div class="history">
                <h4>Deposit History</h4>

                <ul id="depositHistory"></ul>
            </div>

        </div>

        <!-- Withdraw -->

        <div class="card">

            <h3>Withdraw</h3>

            <input type="number" id="withdrawAmount" placeholder="Enter Withdraw Amount">

            <button onclick="withdrawMoney()">Withdraw</button>

            <div class="history">
                <h4>Withdraw History</h4>

                <ul id="withdrawHistory"></ul>
            </div>

        </div>

    </div>

</div>

<script>

function createAccount(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if(name=="" || email=="" || password==""){
        alert("Please fill all fields");
        return;
    }

    if(password !== confirmPassword){
        alert("Password not match");
        return;
    }

    // Hide signup
    document.getElementById("signupBox").style.display="none";

    // Show dashboard
    document.getElementById("dashboard").style.display="block";

    // Profile Data
    document.getElementById("profileName").innerText=name;
    document.getElementById("profileEmail").innerText=email;
}

function depositMoney(){

    let amount=document.getElementById("depositAmount").value;

    if(amount==""){
        alert("Enter amount");
        return;
    }

    let li=document.createElement("li");

    li.innerText="Deposited Rs. "+amount;

    document.getElementById("depositHistory").appendChild(li);

    document.getElementById("depositAmount").value="";
}

function withdrawMoney(){

    let amount=document.getElementById("withdrawAmount").value;

    if(amount==""){
        alert("Enter amount");
        return;
    }

    let li=document.createElement("li");

    li.innerText="Withdraw Rs. "+amount;

    document.getElementById("withdrawHistory").appendChild(li);

    document.getElementById("withdrawAmount").value="";
}

</script>

</body>
</html>
